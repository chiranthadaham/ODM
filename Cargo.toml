[package]
name = "open-download-manager"
version = "0.2.8"
edition = "2021"
license = "MIT"
description = "Native Windows download manager implemented in Rust"
build = "build.rs"

[[bin]]
name = "OpenDownloadManager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
regex = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp",
  "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_JobObjects",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
  "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_Registry", "Win32_System_IO", "Win32_System_Pipes",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Shell_Common", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
